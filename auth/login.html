<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTrade Pro POS — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #2c3e50, #3498db);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%; max-width: 400px;
    }
    .login-box h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .login-box p.subtitle {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #3498db;
      margin-bottom: 5px;
    }
    label {
      display: block;
      margin: 15px 0 5px;
      color: #34495e;
      font-weight: 500;
    }
    input, select, button {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ecf0f1;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    button:hover { background: #2980b9; }
    .error {
      color: #e74c3c;
      margin-top: 15px;
      text-align: center;
      display: none;
    }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #95a5a6;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">ZenTrade Pro</div>
  <h1>System Login</h1>
  <p class="subtitle">Business & POS Management System</p>

  <label for="role">Select Role</label>
  <select id="role">
    <option value="">-- Choose your role --</option>
    <option value="admin">Admin / Owner</option>
    <option value="cashier">Cashier</option>
    <option value="sp">Service Provider</option>
  </select>

  <label for="name">Full Name</label>
  <input type="text" id="name" placeholder="Enter your name">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Enter your password" autocomplete="off">

  <button onclick="loginUser()">LOG IN</button>
  <div class="error" id="errorMsg"></div>
  <div class="info">
    Default Admin: 8888<br>
    Default SP: 19970407chan
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAxuB4gacmWIf3U4Ic5TsOxSHCaynR0vhw",
  authDomain: "bpos-pos.firebaseapp.com",
  projectId: "bpos-pos",
  storageBucket: "bpos-pos.firebasestorage.app",
  messagingSenderId: "1024558399693",
  appId: "1:1024558399693:web:13412d95960d8be732a984",
  measurementId: "G-BY03FZEN6E"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const DEFAULT_PASS = {
  admin: "8888",
  sp: "19970407chan"
};

let idleTimer;

function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    alert("Auto-logout: 10 minutes idle. Please login again.");
    logoutUser();
  }, 10 * 60 * 1000); // 10 mins
}

function logoutUser() {
  localStorage.clear();
  window.location.reload();
}

document.addEventListener('mousemove', resetIdleTimer);
document.addEventListener('keypress', resetIdleTimer);

async function loginUser() {
  const role = document.getElementById('role').value;
  const name = document.getElementById('name').value.trim();
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.style.display = 'none';

  if (!role || !name || !password) {
    errorMsg.textContent = 'Please fill in all fields.';
    errorMsg.style.display = 'block';
    return;
  }

  try {
    let userData = null;

    if (role === 'admin' && password === DEFAULT_PASS.admin) {
      userData = { role: 'admin', name: name };
    } else if (role === 'sp' && password === DEFAULT_PASS.sp) {
      userData = { role: 'sp', name: name };
    } else {
      const snap = await db.collection('users')
        .where('name', '==', name)
        .where('role', '==', role)
        .get();
      
      if (!snap.empty) {
        snap.forEach(doc => {
          const data = doc.data();
          if (data.password === password) {
            userData = { id: doc.id, ...data };
          }
        });
      }
    }

    if (!userData) {
      errorMsg.textContent = 'Invalid name or password.';
      errorMsg.style.display = 'block';
      return;
    }

    localStorage.setItem('user', JSON.stringify(userData));

    if (userData.role === 'admin') {
      window.location.href = '../pages/admin/dashboard.html';
    } else if (userData.role === 'cashier') {
      window.location.href = '../pages/cashier/dashboard.html';
    } else if (userData.role === 'sp') {
      window.location.href = '../pages/sp/dashboard.html';
    }

  } catch (err) {
    errorMsg.textContent = 'System error: ' + err.message;
    errorMsg.style.display = 'block';
  }
}

document.getElementById('password').addEventListener('keypress', e => {
  if (e.key === 'Enter') loginUser();
});

resetIdleTimer();
</script>

</body>
</html>
