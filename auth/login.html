<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPOS — General Business System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { 
      background: linear-gradient(135deg, #1e3a5f 0%, #2c3e50 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: white; border-radius: 16px; padding: 36px 28px; width: 100%; max-width: 440px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo { text-align: center; margin-bottom: 12px; }
    .logo svg { width: 52px; height: 52px; color: #3b82f6; }
    h1 { text-align: center; font-size: 22px; color: #1e293b; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 28px; font-size: 14px; }
    .role-tabs { display: flex; gap: 10px; margin-bottom: 28px; }
    .role-tab {
      flex: 1; padding: 12px 10px; border: 2px solid #e2e8f0; background: white;
      border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600; font-size: 14px;
      transition: all 0.25s;
    }
    .role-tab.active { background: #2563eb; color: white; border-color: #2563eb; }
    .input-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #334155; font-size: 14px; }
    input {
      width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0;
      border-radius: 8px; font-size: 15px; transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%; padding: 14px; background: #2563eb; color: white; border: none;
      border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; margin-top: 16px; text-align: center; font-size: 14px; min-height: 20px; }
    .note { color: #64748b; font-size: 12px; margin-top: 12px; text-align: center; line-height: 1.5; }
    .trial-note { background: #fef3c7; color: #92400e; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    </div>
    <h1>BPOS — General Business System</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="role-tabs">
      <button class="role-tab active" data-role="admin">Admin</button>
      <button class="role-tab" data-role="cashier">Cashier</button>
      <button class="role-tab" data-role="sp">SP</button>
    </div>

    <div id="trialNote" class="trial-note" style="display:none;"></div>

    <form id="loginForm" onsubmit="attemptLogin(event)">
      <input type="hidden" id="selectedRole" value="admin">
      
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit">🔒 SIGN IN</button>
      <p class="error" id="errorMsg"></p>
      <p class="note" id="noteTxt">
        Cashier accounts created by Admin only<br>
        Passwords cleared on logout — type again next time
      </p>
    </form>
  </div>

<script>
// ===== AUTO LOGOUT ON INACTIVITY — 10 MINUTES =====
let inactivityTimer;
function resetTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    alert('⏰ Session expired — Please enter your password again');
    sessionStorage.clear();
    document.getElementById('password').value = '';
  }, 10 * 60 * 1000);
}
['mousedown', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt => {
  document.addEventListener(evt, resetTimer);
});
resetTimer();

// ===== ROLE TAB SWITCHING =====
document.querySelectorAll('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('selectedRole').value = tab.dataset.role;
    document.getElementById('errorMsg').textContent = '';
    updateNote();
  });
});
function updateNote() {
  const role = document.getElementById('selectedRole').value;
  const noteEl = document.getElementById('noteTxt');
  if (role === 'cashier') {
    noteEl.innerHTML = 'Use your First Name as Username<br>Created by Admin only — Password cleared on logout';
  } else if (role === 'sp') {
    noteEl.innerHTML = 'Service Provider access<br>Manage subscriptions & reset Admin passwords';
  } else {
    noteEl.innerHTML = 'Owner / Manager access<br>Create stores, cashiers & manage products';
  }
}

// ===== SUBSCRIPTION & TRIAL CHECK =====
function getSubscriptionStatus() {
  const sub = JSON.parse(localStorage.getItem('subscription') || '{}');
  const now = new Date();
  
  // Start free trial if not started yet
  if (!sub.trialStart) {
    sub.trialStart = now.toISOString();
    sub.isTrial = true;
    localStorage.setItem('subscription', JSON.stringify(sub));
  }
  
  const trialEnd = new Date(sub.trialStart);
  trialEnd.setDate(trialEnd.getDate() + 7); // 1 week free
  
  if (sub.expiryDate) {
    const expiry = new Date(sub.expiryDate);
    return { active: expiry > now, isTrial: false, expiry: expiry, daysLeft: Math.ceil((expiry - now)/(86400000)) };
  } else {
    return { active: trialEnd > now, isTrial: true, expiry: trialEnd, daysLeft: Math.ceil((trialEnd - now)/(86400000)) };
  }
}

// ===== LOGIN ATTEMPT =====
function attemptLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const role = document.getElementById('selectedRole').value;
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';

  const subStatus = getSubscriptionStatus();
  if (!subStatus.active && role !== 'sp') {
    errorEl.textContent = '❌ Subscription expired — Contact Service Provider';
    return;
  }

  // ===== ADMIN LOGIN =====
  if (role === 'admin') {
    const adminUser = localStorage.getItem('adminUser') || 'Admin';
    const adminPass = localStorage.getItem('adminPass') || '8888';
    
    if (username === adminUser && password === adminPass) {
      sessionStorage.setItem('userRole', 'admin');
      sessionStorage.setItem('username', adminUser);
      sessionStorage.setItem('loginTime', new Date().toISOString());
      window.location.href = '/pages/admin/dashboard.html';
      return;
    } else {
      errorEl.textContent = '❌ Invalid admin credentials';
      return;
    }
  }

  // ===== CASHIER LOGIN — FIRST NAME ONLY =====
  if (role === 'cashier') {
    const cashiers = JSON.parse(localStorage.getItem('cashiers') || '[]');
    
    // ✅ FIRST NAME match exactly — last name not used in login
    const found = cashiers.find(c => 
      c.firstName === username &&
      c.password === password &&
      c.active !== false
    );

    if (found) {
      sessionStorage.setItem('userRole', 'cashier');
      sessionStorage.setItem('username', found.firstName);
      sessionStorage.setItem('cashierFullName', found.lastName ? `${found.firstName} ${found.lastName}` : found.firstName);
      sessionStorage.setItem('loginTime', new Date().toISOString());
      window.location.href = '/pages/cashier/dashboard.html';
      return;
    } else {
      errorEl.textContent = '❌ Invalid — Use First Name + 4-digit PIN set by Admin';
      return;
    }
  }

  // ===== SERVICE PROVIDER LOGIN =====
  if (role === 'sp') {
    const spUser = localStorage.getItem('spUser') || 'SP';
    const spPass = localStorage.getItem('spPass') || '19970407chan';
    
    if (username === spUser && password === spPass) {
      sessionStorage.setItem('userRole', 'sp');
      sessionStorage.setItem('username', spUser);
      sessionStorage.setItem('loginTime', new Date().toISOString());
      window.location.href = '/pages/sp/dashboard.html';
      return;
    } else {
      errorEl.textContent = '❌ Invalid Service Provider credentials';
      return;
    }
  }
}
</script>
  <script src="../../js/sync.js"></script>
</body>
</html>
