<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ZenTrade Pro POS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    :root {
      --primary: #3498db;
      --success: #27ae60;
      --danger: #e74c3c;
      --dark: #2c3e50;
      --light: #f8f9fa;
    }
    body {
      background: linear-gradient(135deg, var(--dark), #34495e);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white; padding: 40px 30px; border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      width: 100%; max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: var(--dark); font-size: 24px; }
    .logo p { color: #888; font-size: 14px; margin-top: 5px; }
    .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
    .role-btn {
      flex: 1; padding: 12px; border: 2px solid #ddd; background: white;
      border-radius: 8px; cursor: pointer; font-weight: 600; color: #666;
      transition: all 0.2s;
    }
    .role-btn.active {
      border-color: var(--primary); background: #f0f7ff;
      color: var(--primary);
    }
    input, button {
      width: 100%; padding: 14px 16px; margin: 8px 0;
      border: 2px solid #eee; border-radius: 8px; font-size: 16px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      background: var(--primary); color: white; border: none;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover { background: #2980b9; }
    .error-msg { color: var(--danger); margin-top: 10px; font-weight: 600; display: none; }
    .note { margin-top: 20px; font-size: 13px; color: #888; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>🛒 ZenTrade Pro POS</h1>
    <p>Sign in to your account</p>
  </div>

  <div class="role-selector">
    <button class="role-btn active" data-role="admin" onclick="selectRole('admin')">Admin</button>
    <button class="role-btn" data-role="cashier" onclick="selectRole('cashier')">Cashier</button>
    <button class="role-btn" data-role="sp" onclick="selectRole('sp')">SP</button>
  </div>

  <input type="text" id="userName" placeholder="Username / Name" required>
  <input type="password" id="userPass" placeholder="Password" required onkeypress="if(event.key==='Enter')doLogin()">

  <button onclick="doLogin()">🔐 SIGN IN</button>
  <p id="errorMsg" class="error-msg"></p>

  <p class="note">
    Default SP Password: 19970407chan<br>
    Admin & Cashier accounts created by Admin / SP
  </p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAxuB4gacmWIf3U4Ic5TsOxSHCaynR0vhw",
  authDomain: "bpos-pos.firebaseapp.com",
  projectId: "bpos-pos",
  storageBucket: "bpos-pos.firebasestorage.app",
  messagingSenderId: "1024558399693",
  appId: "1:1024558399693:web:13412d95960d8be732a984",
  measurementId: "G-BY03FZEN6E"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let selectedRole = 'admin';

function selectRole(role) {
  selectedRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-role="${role}"]`).classList.add('active');
  document.getElementById('errorMsg').style.display = 'none';
}

async function doLogin() {
  const name = document.getElementById('userName').value.trim();
  const pass = document.getElementById('userPass').value.trim();
  const errorEl = document.getElementById('errorMsg');
  
  if (!name || !pass) {
    errorEl.textContent = '⚠️ Enter username and password';
    errorEl.style.display = 'block';
    return;
  }

  try {
    let query;
    if (selectedRole === 'sp') {
      // SP login — check name + password
      query = db.collection('users')
        .where('role', '==', 'sp')
        .where('name', '==', name);
    } else {
      // Admin / Cashier login
      query = db.collection('users')
        .where('role', '==', selectedRole)
        .where('name', '==', name);
    }

    const snap = await query.get();

    if (snap.empty) {
      errorEl.textContent = '⚠️ Account not found';
      errorEl.style.display = 'block';
      return;
    }

    let foundUser = null;
    for (const doc of snap.docs) {
      const data = doc.data();
      if (data.password === pass) {
        foundUser = { id: doc.id, ...data };
        break;
      }
    }

    if (!foundUser) {
      errorEl.textContent = '⚠️ Incorrect password';
      errorEl.style.display = 'block';
      return;
    }

    // ✅ Success — Save session
    localStorage.setItem('user', JSON.stringify(foundUser));

    // ⏱️ Auto-create Free Trial kung bagong Admin
    if (selectedRole === 'admin' && !foundUser.plan) {
      await db.collection('users').doc(foundUser.id).update({
        plan: 'trial',
        subscriptionStart: firebase.firestore.FieldValue.serverTimestamp(),
        maxStores: 5,
        maxCashiers: 0 // unlimited
      });
    }

    // 🚀 Redirect based on role
    switch (foundUser.role) {
      case 'admin':
        window.location.href = 'pages/admin/dashboard.html';
        break;
      case 'cashier':
        window.location.href = 'pages/cashier/dashboard.html';
        break;
      case 'sp':
        window.location.href = 'pages/sp/dashboard.html';
        break;
    }

  } catch (err) {
    errorEl.textContent = '❌ Connection error: ' + err.message;
    errorEl.style.display = 'block';
  }
}
</script>
</body>
</html>
