<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify PIN — BPOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center">
    <h2 class="text-xl font-bold mb-2">System PIN Required</h2>
    <p class="text-gray-500 mb-6">Enter PIN to continue</p>
    <input type="password" id="system-pin" placeholder="Enter PIN" maxlength="12"
      class="w-full border rounded-lg px-4 py-3 text-center text-lg tracking-widest focus:ring-2 focus:ring-blue-500 outline-none">
    <button id="verify-pin" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700">
      Verify
    </button>
  </div>
  <script type="module" src="pin-verify.js"></script>
</body>
</html>
