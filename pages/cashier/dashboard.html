<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTrade Pro — Cashier POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-emerald-700 text-white px-6 py-3 flex justify-between items-center shadow">
    <h1 class="text-xl font-bold">💳 ZenTrade Pro — Cashier Station</h1>
    <div>
      <span id="cashier-name" class="mr-4">Welcome</span>
      <button id="logout-btn" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 p-4">
    <!-- Products Section -->
    <section class="lg:col-span-2 bg-white rounded shadow p-4">
      <h2 class="text-lg font-semibold mb-3">Products</h2>
      <input type="text" id="search-product" placeholder="Search product..." 
        class="w-full border rounded px-3 py-2 mb-4 focus:ring-2 focus:ring-emerald-500 outline-none">
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
        <!-- Products load here -->
      </div>
    </section>

    <!-- Cart Section -->
    <section class="bg-white rounded shadow p-4">
      <h2 class="text-lg font-semibold mb-3">Current Sale</h2>
      <div id="cart-items" class="space-y-2 mb-4 max-h-80 overflow-y-auto border-b pb-3">
        <p class="text-gray-500 text-sm">No items added</p>
      </div>
      
      <div class="space-y-2 mb-4">
        <div class="flex justify-between text-lg font-bold">
          <span>Total:</span>
          <span id="cart-total">₱0.00</span>
        </div>
        <input type="number" id="cash-tendered" placeholder="Cash Tendered" step="0.01" min="0"
          class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none">
        <div class="flex justify-between font-semibold">
          <span>Change:</span>
          <span id="change-amount">₱0.00</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button id="clear-cart" class="bg-gray-500 hover:bg-gray-600 text-white py-2 rounded">Clear</button>
        <button id="checkout-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-bold">Pay</button>
      </div>
    </section>
  </main>

  <script type="module" src="cashier.js"></script>
</body>
</html>
